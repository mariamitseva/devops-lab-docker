---
- name: Configure all servers
  hosts: all
  become: true
  tasks:
    - name: Install common packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Configure PostgreSQL
  hosts: db
  become: true
  vars:
    db_name: notes
    db_user: notes
    db_password: "{{ lookup('ansible.builtin.env', 'NOTES_DB_PASSWORD', default=undef()) }}"

  tasks:
    - name: Install PostgreSQL and its Python driver
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present

    - name: Configure PostgreSQL listen addresses
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: '^\s*#?\s*listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow IPv4 connections with SCRAM authentication
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        line: 'host all all 0.0.0.0/0 scram-sha-256'
      notify: Restart PostgreSQL

    - name: Start and enable PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Create the Notes database user
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        state: present
      no_log: true

    - name: Create the Notes database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
